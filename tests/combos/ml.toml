# 부품(.gate/parts)과 덮어쓰기(.gate/local.toml)를 조립한 구조다. 제안서와 gate adopt로만 바뀐다(.gate/GATE.md).
version = 1

[project]
unreviewed = ["측정", "정리", "기록", "결정", "표본 실행", "값 근거"]
plans_dir = "experiments/plans"
plan_prefix = "P"
code = ["experiments/*.py", "src/*.py", "submissions/*.py"]
tracked = ["progress", "experiments", "src", "submissions", "docs", ".gate", ".githooks"]
files_section = "행 조건 대조표"
stop_states = ["RECORD", "REPLAN"]
max_visits = 3
decisions_file = "progress/decisions.md"
status_file = "progress/status.md"
status_sections = ["단계", "열린 질문", "다음에 볼 것"]

[remote]
exec_states = ["RECORD", "MEASURE"]
host = ""
port = 22
dir = "~/project"

[review]
tools = "Read,Grep,Glob"
effort = "high"
cite = ["E\\d{3}"]

[records]
archive_file = "progress/history.md"
index = "experiments/plans/INDEX.md"
index_items = ["기록: log.csv 행", "결정: 고른 갈래"]
ledgers = ["experiments/log.csv", "progress/decisions.md"]
supersedes = "^- 대체하는 결정:"
superseded = "^- 대체됨:"

[[stages]]
n = 0
name = "준비, EDA"
kinds = ["eda", "infra"]

[[stages]]
n = 1
name = "baseline, 주력 확정"
kinds = ["model", "tune", "eda", "infra"]

[[stages]]
n = 2
name = "결합"
kinds = ["new", "model", "tune", "eda", "infra"]

[[stages]]
n = 3
name = "동결"
kinds = ["freeze", "tune", "infra"]

[[stages]]
n = 4
name = "재현, 최종 제출"
kinds = ["repro", "infra"]

[kinds.tidy]
states = ["SURVEY", "TIDY", "CONFIRM"]
back = {CONFIRM = ["TIDY"]}
any_stage = true

[kinds.new]
states = ["RESEARCH", "IDEATE", "SELECT", "PLAN", "IMPLEMENT", "RUN", "RECORD", "REPLAN"]
back = {RUN = ["IMPLEMENT", "PLAN"]}

[kinds.model]
states = ["RESEARCH", "IDEATE", "SELECT", "PLAN", "IMPLEMENT", "RUN", "RECORD", "REPLAN"]
back = {RUN = ["IMPLEMENT", "PLAN"]}

[kinds.tune]
states = ["PLAN", "IMPLEMENT", "RUN", "RECORD", "REPLAN"]
back = {RUN = ["IMPLEMENT", "PLAN"]}

[kinds.freeze]
states = ["PLAN", "IMPLEMENT", "RUN", "RECORD", "REPLAN"]
back = {RUN = ["IMPLEMENT", "PLAN"]}

[kinds.repro]
states = ["PLAN", "RUN", "RECORD"]
back = {RUN = ["PLAN"]}

[kinds.infra]
states = ["IMPLEMENT", "RECORD"]
limit = {max_files = 5}

[kinds.eda]
states = ["QUESTION", "MEASURE", "RECORD", "REPLAN"]

[sections."측정"]
body = """
- 정리 전 크기:
- 옮길 항목:
"""

[sections."정리"]
body = """
- 옮긴 항목:
- 대체 표시를 붙인 결정:
"""

[sections."조사"]
body = """
| 읽은 문서(경로나 URL) | 읽고 얻은 것 |
|---|---|

| 지난 실험 번호 | 이번 계획과의 관계 |
|---|---|
"""

[sections."후보"]
body = """
| 후보 ID | 축 | 후보 | 기대 이득 | 비용 | 겹치는 지난 실험 | 선택 | 이유(한두 문장과 실험 번호) |
|---|---|---|---|---|---|---|---|

- 고른 묶음:
"""

[sections."행 조건 대조표"]
body = """
| 아이디어 행의 조건 | 구현 파일 | 함수나 위치 |
|---|---|---|
"""

[sections."비교 기준"]
body = """
- 기준 실험:
- 판정 규칙:
"""

[sections."결과별 다음 행동"]
body = """
| 결과 경계 | 다음 행동 | 가리키는 항목 |
|---|---|---|
"""

[sections."실행 계획"]
body = """
- 실행 위치:
- 결과 파일:
- 조기 종료 결과 파일:
- 예상 소요 시간과 근거:
- 가벼운 실행:
"""

[sections."값 근거"]
body = """
| 값 | 쓰는 곳 | 근거 |
|---|---|---|
"""

[sections."표본 실행"]
body = """
- 명령:
- 커밋:
- 결과 요약:
"""

[sections."기록"]
body = """
- log.csv 행:
- ideas.md 상태:
- 일반 원칙과의 관계:
"""

[sections."결정"]
body = """
- 고른 갈래:
- status.md 영향:
"""

[sections."질문"]
body = """
- 질문:
- 바뀌는 결정:
- 측정 방법:
"""

[states.SURVEY]
sections = ["측정"]
todo = [
  "python -X utf8 .gate/gate.py records를 돌려 현재 상태 문서, 보관 문서, 상태 파일의 크기를 \"정리 전 크기\"에 옮겨 쓴다.",
  "현재 상태 문서에서 닫힌 항목(끝난 일, 답이 나온 질문, 지나간 경과)을 찾아 \"옮길 항목\"에 쓴다.",
]
checks = [
  {check = "filled", section = "측정", items = ["정리 전 크기", "옮길 항목"], part = "cleanup"},
  {check = "survey", part = "cleanup"},
]

[states.TIDY]
sections = ["정리"]
todo = [
  "닫힌 항목을 현재 상태 문서에서 보관 문서([records] archive_file)로 옮긴다. 문장을 고치지 않고 그대로 옮긴다.",
  "바뀐 결정이 있으면 새 항목의 대체 줄([records] supersedes)에 옛 항목 제목을 따옴표로 적거나, 옛 항목에 대체 표시 줄([records] superseded)을 적는다. 검토 발췌는 대체된 항목을 제목만 남긴다. 실험 기록과 결정 문서의 행은 지우지 않는다.",
  "\"정리\" 절에 옮긴 항목과 대체 표시를 붙인 결정을 쓰고 커밋한다.",
]
checks = [
  {check = "filled", section = "정리", items = ["옮긴 항목"], part = "cleanup"},
]

[states.CONFIRM]
todo = [
  "next로 확인한다. 정리 전에 풀리던 참조와 항목 ID가 모두 남아 있고 현재 상태 문서가 상한 안이어야 넘어간다.",
  "막히면 TIDY로 back해서 빠진 내용을 되살린다.",
]
checks = [
  {check = "kept", part = "cleanup"},
  {check = "doc_size", part = "cleanup"},
]

[states.RESEARCH]
sections = ["조사"]
todo = ["관련 문서(논문, 위키, 지난 대회 솔루션)를 읽고 \"조사\" 절 첫 표에 경로나 URL과 얻은 것을 쓴다.", "같은 정보원을 다룬 지난 실험 번호를 둘째 표에 쓴다."]
checks = [
  {check = "table", section = "조사", index = 0, part = "experiment"},
  {check = "paths_exist", section = "조사", part = "experiment"},
  {check = "refs", section = "조사", pattern = "E\\d{3}", file = "experiments/log.csv", part = "experiment"},
]

[states.IDEATE]
sections = ["후보"]
todo = [
  "정보원 하나를 여러 축(정보 표현, 넣는 자리, 범위, 조건부 적용, 기존 신호와 조합, 다른 정보원, 조사한 기법)으로 펼쳐 \"후보\" 표에 쓴다. 일부러 엉뚱한 후보도 넣는다.",
  "새 후보는 progress/ideas.md에 행을 더한다.",
  "뺄 후보는 선택 칸에 \"제외\"와 이유를 쓴다. 이유는 한두 문장과 실험 번호로 250자 안에 쓴다.",
  "next P### --review로 검토자를 부른다.",
]
checks = [
  {check = "table", section = "후보", min_rows = 3, part = "experiment"},
  {check = "cell_max", section = "후보", column = 7, max = 250, part = "experiment"},
]
context = ["progress/ideas.md", "experiments/log.csv"]
review = "{plan}의 '조사'와 '후보' 절을 검토한다. 먼저 발췌 {context}를 읽고, 더 필요한 내용은 원본을 Grep으로 찾아 필요한 줄만 읽는다(progress/ideas.md, experiments/log.csv를 Read로 통째로 열지 않는다). '조사' 절에 적힌 문서를 읽는다. 다음을 찾는다. (1) 후보가 없거나 형식만 채운 축 (2) 조사한 문서와 ideas.md에 있는데 후보에 없는 기법 (3) 지난 실험에서 기여가 없던 방식과 같은데 이유 없이 넣은 후보."
review_model = "sonnet"
review_part = "experiment"

[states.SELECT]
sections = ["후보"]
todo = [
  "후보마다 기대 이득, 비용, 겹치는 지난 실험 번호를 채운다.",
  "이번에 잴 후보는 선택 칸에 \"선택\", 미룰 후보는 \"보류\"를 쓰고 이유를 한두 문장과 실험 번호로 250자 안에 쓴다. 싼 변형은 한 실험으로 묶는다.",
  "\"고른 묶음\"에 함께 잴 후보와 묶은 이유를 쓴다.",
]
checks = [
  {check = "filled", section = "후보", items = ["고른 묶음"], part = "experiment"},
  {check = "cell_max", section = "후보", column = 7, max = 250, part = "experiment"},
  {check = "refs", section = "후보", pattern = "E\\d{3}", file = "experiments/log.csv", part = "experiment"},
]

[states.PLAN]
sections = ["행 조건 대조표", "비교 기준", "결과별 다음 행동", "실행 계획"]
todo = [
  "\"행 조건 대조표\"에 아이디어 행의 조건 하나마다 구현할 파일과 함수를 쓴다.",
  "\"비교 기준\"에 기준 실험 번호와 판정 규칙(seed 수, 작은 차이의 처리)을 쓴다.",
  "\"결과별 다음 행동\"에 수치 경계를 붙인 갈래를 두 개 이상 쓴다. 어느 갈래에도 맞지 않으면 \"예상 밖이면 RESEARCH부터\"로 둔다.",
  "\"실행 계획\"에 실행 위치, 결과 파일 경로, 예상 소요 시간과 근거를 쓴다. 일찍 끝나는 갈래가 있으면 그 갈래에서도 생기는 파일을 \"조기 종료 결과 파일\"에 쓴다. 실행 비용이 작아 IMPLEMENT 코드 diff 검토를 건너뛸 실행이면 \"가벼운 실행\"에 \"예(이유)\"를 쓴다.",
  "next P### --review로 검토자를 부른다.",
]
checks = [
  {check = "table", section = "행 조건 대조표", part = "experiment"},
  {check = "files_listed", skip = ["repro"], part = "experiment"},
  {check = "filled", section = "비교 기준", items = ["기준 실험", "판정 규칙"], part = "experiment"},
  {check = "table", section = "결과별 다음 행동", min_rows = 2, part = "experiment"},
  {check = "filled", section = "실행 계획", items = ["실행 위치", "결과 파일", "예상 소요 시간과 근거"], part = "experiment"},
  {check = "refs", section = "비교 기준", pattern = "E\\d{3}", file = "experiments/log.csv", part = "experiment"},
]
context = ["progress/ideas.md", "progress/decisions.md", "progress/status.md", "experiments/log.csv"]
review = "{plan}의 계획을 검토한다. 먼저 발췌 {context}를 읽고, 더 필요한 내용은 원본을 Grep으로 찾아 필요한 줄만 읽는다(발췌의 네 파일을 Read로 통째로 열지 않는다). 다음을 찾는다. (1) 아이디어 행 문장의 조건 중 '행 조건 대조표'에 없는 것 (2) decisions.md의 결정과 어긋나는 설정 (3) status.md 계획과 맞지 않는 '결과별 다음 행동' (4) 근거가 없는데 근거 있는 것처럼 적은 값 (5) '실행 계획'의 '가벼운 실행'이 '예'인데 예상 소요 시간과 근거로 보아 실행 비용이 작지 않거나 결과가 채택 후보로 이어져 IMPLEMENT 코드 diff 검토를 건너뛰면 안 되는 실행."
review_model = "sonnet"
review_part = "experiment"
roles = ["plan"]

[states.IMPLEMENT]
sections = ["행 조건 대조표", "값 근거", "표본 실행"]
code = true
todo = [
  "행 조건 대조표대로 코드를 쓴다.",
  "코드에 넣은 숫자 값(0과 1 제외)을 \"값 근거\" 표에 모두 쓴다. 값 칸에는 숫자 하나만 쓰고, 근거가 없으면 \"근거 없이 정한 값\"으로 쓴다.",
  "작은 표본으로 끝까지 돌려 보고, 명령, 커밋, 결과 요약을 \"표본 실행\" 절에 쓴다.",
  "코드와 계획 파일을 커밋한다.",
  "next P### --review로 코드 diff 검토를 받는다. 지적이 맞으면 코드를 고쳐 커밋하고 다시 부른다. \"실행 계획\"의 \"가벼운 실행\"이 \"예\"로 시작하면 검토 없이 넘어가고 면제가 검토 기록에 남는다.",
]
checks = [
  {check = "files_listed", part = "experiment"},
  {check = "clean", part = "experiment"},
  {check = "files_changed", part = "experiment"},
  {check = "numbers", section = "값 근거", part = "value-evidence"},
  {check = "sample", section = "표본 실행", skip = ["infra"], part = "sample-run"},
  {check = "reviewed", state = "PLAN", skip = ["infra"], part = "experiment"},
]
review_exempt = {section = "실행 계획", item = "가벼운 실행"}
context = ["experiments/log.csv"]
review = "{plan}의 '행 조건 대조표', '비교 기준', '실행 계획', '값 근거'와 코드 diff {diff}를 검토한다. 먼저 발췌 {context}를 읽고, diff 밖 코드는 필요한 함수만 Grep으로 찾아 읽는다. 계획의 설계는 PLAN에서 검토했으니 다시 보지 않는다. 다음을 찾는다. (1) 대조표 조건 가운데 diff에 구현이 없거나 다르게 구현된 것 (2) 같은 feature나 점수를 학습과 채점에서 다른 전처리, 척도, 정렬로 만드는 곳 (3) 비교 기준 실험과 seed, 표본 추출, 추출 순서, 데이터 분할이 달라져 대조군이 기준 실험과 같지 않게 되는 곳 (4) 결측, NaN, 빈 키, 동률처럼 실제 데이터에 있는 형태를 처리하지 않는 곳 (5) 검증이나 정답 기간의 정보가 학습, 후보 생성, early stopping에 들어가는 누수 (6) 결과 파일 경로가 '실행 계획'과 다른 곳 (7) 종류가 infra인데 기존 실험의 점수를 바꿀 수 있는 변경(그러면 tune으로 다시 시작해 비교 기준을 다시 재야 한다)."
review_part = "experiment-diff-review"
roles = ["implement"]

[states.RUN]
run = true
todo = ["gate run으로 예상 종료 시각과 근거를 적은 뒤 실행한다.", "답에 남은 시간과 끝나는 시각을 쓴다.", "결과가 나오면 next로 RECORD에 들어간다."]
checks = [
  {check = "run_record", part = "run-record"},
  {check = "code_unchanged", part = "run-record"},
  {check = "results", section = "실행 계획", item = "결과 파일", part = "experiment"},
]
sections = ["실행 계획"]
roles = ["execute"]

[states.RECORD]
sections = ["기록"]
todo = [
  "experiments/log.csv에 실험 행을 쓰고 \"기록\" 절의 log.csv 행에 그 실험 번호를 쓴다.",
  "progress/ideas.md 행의 상태를 결과에 맞게 고치고 실험 번호를 쓴다.",
  "결과가 일반 원칙과 어긋나는지 \"기록\" 절에 쓴다.",
  "답에 \"기록\" 절 내용을 옮겨 쓴다.",
]
checks = [
  {check = "refs", section = "기록", pattern = "E\\d{3}", file = "experiments/log.csv", required = true, skip = ["eda", "infra"], part = "experiment"},
  {check = "refs", section = "기록", pattern = "E\\d{3}", file = "progress/ideas.md", skip = ["eda", "infra"], part = "experiment"},
  {check = "filled", section = "기록", items = ["일반 원칙과의 관계"], skip = ["infra"], part = "experiment"},
]
roles = ["record"]

[states.REPLAN]
sections = ["결정"]
todo = [
  "\"결과별 다음 행동\"에서 결과에 맞는 갈래를 골라 \"결정\" 절에 쓴다.",
  "어느 갈래에도 맞지 않으면 \"고른 갈래\"에 \"예상 밖\"을 쓰고 start --from P###로 새 계획을 RESEARCH에서 시작한다.",
  "progress/status.md \"다음에 볼 것\"에 주는 영향을 쓰고 이 계획 번호를 적어 커밋한다.",
  "답에 \"결정\" 절 내용을 옮겨 쓴다.",
]
checks = [
