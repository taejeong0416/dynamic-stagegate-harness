# service preset: 웹 서비스와 앱 개발
# 하네스 구조의 원본이다. 종류(kinds)는 상태 순서와 조건부 경로(when)를, 상태(states)는 할 일, 검사, 쓰는 절을,
# 절(sections)은 계획 틀에 들어갈 내용을 정한다. 이 파일은 제안서와 gate adopt로만 바꾼다(.gate/GATE.md).
version = 1

[project]
plans_dir = "plans"
plan_prefix = "P"
# 고칠 때 코드 상태(code = true)인 계획이 있어야 하는 파일. *는 /도 넘는다
code = ["src/*", "app/*", "lib/*", "server/*", "client/*", "packages/*", "tests/*", "test/*"]
# stop hook이 이 세션이 고친 파일의 미커밋 변경을 보는 폴더
tracked = ["src", "app", "lib", "server", "client", "packages", "tests", "test", "plans", "docs", ".gate", ".githooks"]
files_section = "변경 파일"
unreviewed = ["테스트 결과", "테스트 수정", "원인", "검증", "기록"]
# 이번 턴에 다룬 계획이 이 상태에 있으면 멈추지 못한다
stop_states = ["RECORD"]
max_visits = 3
# 프로젝트 전체 테스트 명령. TEST와 VERIFY가 쓴다. 비우면 계획 파일의 테스트 명령을 쓴다
test = ""
# 계획의 코드 파일이 영향을 주는 테스트만 돌리는 명령. chore의 IMPLEMENT가 쓰고, 비우면 test를 쓴다.
# {files}는 계획의 코드 파일로 바뀐다. 예: npx vitest related --run {files}, npx jest --findRelatedTests {files}
affected = ""
# 테스트 파일. 먼저 쓴 테스트나 refactor 전의 테스트를 고치거나 지우면 '테스트 수정' 표에 적어야 넘어간다
tests = ["tests/*", "test/*", "*/tests/*", "*/test/*", "*/__tests__/*", "*/test_*", "test_*", "*_test.*", "*.test.*",
         "*.spec.*"]

[review]
tools = "Read,Grep,Glob"
# 검토자는 사용자 설정을 읽지 않으므로 추론 단계를 여기서 정한다
effort = "high"

[kinds.feature]
states = ["SPEC", "PLAN", "TESTFIRST", "IMPLEMENT", "TEST", "REVIEW", "RECORD"]
back = {TEST = ["IMPLEMENT", "PLAN", "SPEC"], REVIEW = ["IMPLEMENT", "PLAN", "SPEC"]}

[kinds.bugfix]
states = ["REPRO", "FIX", "VERIFY", "REVIEW", "RECORD"]
back = {VERIFY = ["FIX", "REPRO"], REVIEW = ["FIX", "REPRO"]}

[kinds.refactor]
states = ["PLAN", "IMPLEMENT", "TEST", "REVIEW", "RECORD"]
back = {TEST = ["IMPLEMENT", "PLAN"], REVIEW = ["IMPLEMENT", "PLAN"]}

[kinds.chore]
states = ["IMPLEMENT", "RECORD"]
# 이 조건을 벗어난 계획은 넘어가지 못한다. 5는 근거 없이 정한 값
limit = {max_files = 5}

[sections."요구사항"]

[sections."수용 기준"]
body = """
| 기준 | 확인 방법 |
|---|---|
"""

[sections."범위 밖"]

[sections."변경 파일"]
body = """
| 파일 | 바꿀 내용 |
|---|---|
"""

[sections."테스트 계획"]
body = """
- 새 테스트 명령:
- 테스트 명령:
- 확인할 동작:
"""

[sections."위험"]

[sections."테스트 결과"]
body = """
| 기준이나 동작 | 결과 |
|---|---|
"""

[sections."테스트 수정"]
body = """
| 파일 | 고친 이유 |
|---|---|
"""

[sections."재현"]
body = """
- 증상:
- 재현 명령:
"""

[sections."원인"]

[sections."검증"]
body = """
- 테스트 명령:
- 결과:
"""

[sections."기록"]
body = """
- 바뀐 동작:
- 문서 영향:
- 남은 일:
"""

[states.SPEC]
sections = ["요구사항", "수용 기준", "범위 밖"]
todo = [
  "\"요구사항\" 절에 사용자가 보는 동작을 쓴다.",
  "\"수용 기준\" 표에 기준마다 확인 방법(테스트, 화면 확인, 명령)을 쓴다.",
  "\"범위 밖\" 절에 이번에 하지 않을 것을 쓴다.",
  "next P### --review로 검토자를 부른다.",
]
checks = [
  {check = "filled", section = "요구사항"},
  {check = "table", section = "수용 기준"},
  {check = "filled", section = "범위 밖"},
]
review = "{plan}의 '요구사항', '수용 기준', '범위 밖' 절을 검토한다. 저장소의 관련 코드와 docs/를 읽는다. 다음을 찾는다. (1) 확인 방법이 없거나 주관적인 수용 기준 (2) 요구사항에 있는데 수용 기준이 없는 동작 (3) 기존 코드의 동작과 어긋나는 요구사항."
review_model = "sonnet"

[states.PLAN]
sections = ["변경 파일", "테스트 계획", "위험"]
todo = [
  "\"변경 파일\" 표에 고칠 파일과 바꿀 내용을 쓴다. 테스트 파일도 쓴다.",
  "\"테스트 계획\"에 새로 쓸 테스트만 돌리는 명령(새 테스트 명령), 전체 테스트 명령, 확인할 동작(수용 기준이나 refactor가 보존할 동작)을 쓴다.",
  "\"위험\" 절에 깨질 수 있는 곳을 쓴다.",
  "next P### --review로 검토자를 부른다.",
]
checks = [
  {check = "files_listed"},
  {check = "table", section = "변경 파일"},
  {check = "filled", section = "테스트 계획", items = ["확인할 동작"]},
  {check = "filled", section = "테스트 계획", items = ["새 테스트 명령"], only = ["feature"]},
]
review = "{plan}의 계획을 검토한다. 계획 파일이 가리키는 코드와 테스트를 읽는다. 다음을 찾는다. (1) 요구사항이나 목표 중 '변경 파일' 표가 다루지 않는 것 (2) 수용 기준이나 보존할 동작 중 '테스트 계획'이 확인하지 않는 것 (3) 기존 구조와 어긋나는 설계 (4) '위험'에 빠진 영향 범위."
review_model = "sonnet"

[states.TESTFIRST]
code = true
# 테스트 파일([project] tests)만 고치고 커밋할 수 있다
edit = "tests"
sections = ["테스트 계획"]
todo = [
  "수용 기준마다 테스트를 먼저 쓰고 \"변경 파일\" 표에 넣는다. 이 상태에서는 테스트 파일만 고칠 수 있다.",
  "테스트를 커밋한다. \"새 테스트 명령\"이 지금 실패해야 넘어간다(구현 전이라 실패하는 게 맞다).",
]
checks = [
  {check = "files_listed"},
  {check = "clean"},
  {check = "files_changed", any = true},
  {check = "command", section = "테스트 계획", item = "새 테스트 명령", expect = "fail"},
]

[states.IMPLEMENT]
code = true
sections = ["변경 파일"]
todo = [
  "\"변경 파일\" 표대로 코드를 쓴다. 표에 없는 파일이 필요하면 표에 더한다(pre-commit이 표에 없는 코드 파일을 막는다).",
  "코드 작성은 Agent 도구에 model \"sonnet\"과 effort \"high\"를 주고 계획 파일 경로와 통과시킬 테스트 명령을 넘겨 서브에이전트에 맡긴다. 몇 줄만 고치면 직접 쓴다. 돌아온 변경을 확인한다.",
  "먼저 쓴 테스트나 refactor 전의 테스트를 고치거나 지우면 \"테스트 수정\" 표에 파일과 이유를 쓴다. 기대값을 구현에 맞춰 바꾸지 않는다.",
  "코드를 커밋한다. chore는 [project] affected(비었으면 test) 명령이 통과해야 넘어간다.",
]
checks = [
  {check = "files_listed"},
  {check = "clean"},
  {check = "files_changed", any = true},
  {check = "command", use = "affected", optional = true, only = ["chore"]},
]

[states.TEST]
sections = ["테스트 결과", "테스트 수정"]
todo = [
  "새 테스트 명령과 전체 테스트 명령([project] test, 비었으면 \"테스트 계획\"의 테스트 명령)을 돌린다.",
  "\"테스트 결과\" 표에 기준이나 동작마다 결과를 쓴다. feature는 \"수용 기준\" 표의 기준을 첫 칸에 그대로 옮긴다.",
]
checks = [
  {check = "clean"},
  {check = "test_edits", state = "TESTFIRST", section = "테스트 수정", only = ["feature"]},
  {check = "test_edits", section = "테스트 수정", only = ["refactor"]},
  {check = "unchanged", state = "SPEC", only = ["feature"]},
  {check = "unchanged", state = "TESTFIRST", section = "테스트 계획", items = ["새 테스트 명령"], only = ["feature"]},
  {check = "command", section = "테스트 계획", item = "새 테스트 명령", only = ["feature"]},
  {check = "command", use = "test", section = "테스트 계획", item = "테스트 명령"},
  {check = "table", section = "테스트 결과"},
  {check = "covers", section = "테스트 결과", from = "수용 기준", only = ["feature"]},
]

[states.REPRO]
code = true
edit = "tests"
sections = ["재현", "변경 파일"]
todo = [
  "\"재현\" 절에 증상과 재현 명령을 쓴다. 재현 명령은 지금 실패해야 한다.",
  "재현 테스트를 쓰고 \"변경 파일\" 표에 넣은 뒤 커밋한다.",
]
checks = [
  {check = "filled", section = "재현", items = ["증상", "재현 명령"]},
  {check = "clean"},
  {check = "command", section = "재현", item = "재현 명령", expect = "fail"},
]

[states.FIX]
code = true
sections = ["원인", "테스트 수정"]
todo = [
  "\"원인\" 절에 원인과 고친 위치를 쓴다.",
  "코드 작성은 Agent 도구에 model \"sonnet\"과 effort \"high\"를 주고 계획 파일 경로와 재현 명령을 넘겨 서브에이전트에 맡긴다. 몇 줄만 고치면 직접 쓴다. 돌아온 변경을 확인한다.",
  "고치고 커밋한다. 재현 명령이 통과해야 넘어간다. REPRO에서 쓴 테스트를 고치면 \"테스트 수정\" 표에 파일과 이유를 쓴다.",
]
checks = [
  {check = "filled", section = "원인"},
  {check = "clean"},
  {check = "files_changed", any = true},
  {check = "test_edits", state = "REPRO", section = "테스트 수정"},
  {check = "unchanged", state = "REPRO", section = "재현", items = ["재현 명령"]},
  {check = "command", section = "재현", item = "재현 명령"},
]

[states.VERIFY]
sections = ["검증"]
todo = [
  "전체 테스트 명령([project] test, 비었으면 \"검증\" 절의 테스트 명령)을 돌리고 결과를 쓴다.",
]
checks = [
  {check = "filled", section = "검증", items = ["결과"]},
  {check = "command", use = "test", section = "검증", item = "테스트 명령"},
]

[states.REVIEW]
todo = [
  "next P### --review로 검토자를 부른다. 검토자는 계획을 시작한 뒤의 코드 diff를 계획 파일과 견준다.",
  "지적이 맞으면 코드는 IMPLEMENT나 FIX로, 계획은 PLAN, SPEC, REPRO로 back해서 고친다.",
]
checks = [
  {check = "clean"},
]
review = "{plan}과 계획을 시작한 뒤의 코드 diff {diff}를 검토한다. diff 파일 머리에 '변경 파일' 표와 맞지 않는 파일 목록이 있다. 다음을 찾는다. (1) '변경 파일' 표와 diff가 맞지 않는 곳(표에 있는데 바뀌지 않은 파일, '바꿀 내용'과 다른 변경) (2) feature의 '수용 기준', bugfix의 '재현', refactor의 '확인할 동작' 가운데 확인하는 테스트가 diff나 저장소에 없는 것 (3) '테스트 수정' 표의 테스트 변경 가운데 단언을 빼거나 기대값을 구현에 맞춰 바꿔 테스트를 약하게 한 것 (4) '범위 밖'에 적은 것을 건드린 변경 (5) diff가 새로 만든 결함(빠진 오류 처리, 경계값, 자원 정리, 동시성)."

[states.RECORD]
sections = ["기록"]
todo = [
  "\"기록\" 절에 바뀐 동작, 문서 영향, 남은 일을 쓴다.",
  "README, docs, CHANGELOG에 영향이 있으면 고쳐 커밋한다.",
]
checks = [
  {check = "filled", section = "기록", items = ["바뀐 동작", "문서 영향", "남은 일"]},
]
