# 부품(.gate/parts)과 덮어쓰기(.gate/local.toml)를 조립한 구조다. 제안서와 gate adopt로만 바뀐다(.gate/GATE.md).
version = 1

[project]
plans_dir = "plans"
plan_prefix = "P"
code = ["src/*", "app/*", "lib/*", "server/*", "client/*", "packages/*", "tests/*", "test/*"]
tracked = [
  "src",
  "app",
  "lib",
  "server",
  "client",
  "packages",
  "tests",
  "test",
  "plans",
  "docs",
  ".gate",
  ".githooks",
]
files_section = "변경 파일"
unreviewed = ["기록"]
stop_states = ["RECORD"]
max_visits = 3
test = ""

[review]
tools = "Read,Grep,Glob"
effort = "high"
docs = ["README.md", "CLAUDE.md", "docs/"]

[records]
index = "plans/INDEX.md"
index_items = ["기록: 바뀐 동작"]

[kinds.chore]
states = ["IMPLEMENT", "RECORD"]
limit = {max_files = 5}

[kinds.work]
states = ["PLAN", "IMPLEMENT", "RECORD"]

[sections."변경 파일"]
body = """
| 파일 | 바꿀 내용 |
|---|---|
"""

[sections."기록"]
body = """
- 바뀐 동작:
- 확인한 곳:
- 고친 문서:
- 남은 일:
"""

[sections."요구사항"]

[sections."수용 기준"]
body = """
| 기준 | 확인 방법 |
|---|---|
"""

[sections."범위 밖"]

[sections."위험"]

[states.IMPLEMENT]
code = true
sections = ["변경 파일"]
todo = [
  "\"변경 파일\" 표대로 코드와 문서를 고친다. 표에 없는 파일이 필요하면 표에 더한다(pre-commit이 표에 없는 코드 파일을 막는다).",
  "검사를 먼저 쓸 수 있는 작업은 검사부터 커밋하고 구현을 커밋한다.",
  "[project] test 명령이 있으면 통과해야 넘어간다. work는 PLAN에서 쓴 요구사항, 수용 기준, 범위 밖을 구현하며 바꾸면 막힌다.",
]
checks = [
  {check = "files_listed", part = "solo"},
  {check = "clean", part = "solo"},
  {check = "files_changed", any = true, part = "solo"},
  {check = "unchanged", state = "PLAN", sections = ["요구사항", "수용 기준", "범위 밖"], only = ["work"], part = "solo"},
  {check = "command", use = "test", optional = true, part = "solo"},
]
roles = ["implement"]

[states.RECORD]
sections = ["기록"]
todo = [
  "\"기록\"에 바뀐 동작, 확인한 곳(검사 출력, 화면, 기기 가운데 어디서 확인했는지), 고친 문서, 남은 일을 쓴다.",
  "README와 docs에 영향이 있으면 고쳐 커밋한다.",
  "next P### --review로 문서 정합성 검토를 받는다. 검토자는 변경 diff와 [review] docs의 문서를 견준다.",
]
checks = [
  {check = "filled", section = "기록", items = ["바뀐 동작", "확인한 곳", "고친 문서", "남은 일"], part = "solo"},
]
review = "{plan}과 계획을 시작한 뒤의 변경 diff {diff}를 읽는다. diff 파일 끝에 문서의 diff가 함께 있다. 프로젝트 문서 {docs} 가운데 이 변경과 관련된 곳을 읽는다. 다음만 FAIL로 낸다. (1) 이 변경 때문에 사실과 달라진 문서의 문장 (2) 고쳐야 하는데 고치지 않은 문서(코드 구조나 동작이 바뀌었는데 그것을 적은 문서를 고치지 않은 것, 결정이 바뀌었는데 결정을 적은 문서를 고치지 않은 것) (3) 서로 어긋나는 두 문서. 문체, 표현, 문서에 더 적으면 좋을 내용은 FAIL로 내지 않는다."
review_model = "sonnet"
review_part = "doc-review"
roles = ["record"]

[states.PLAN]
sections = ["요구사항", "수용 기준", "범위 밖", "변경 파일", "위험"]
todo = [
  "\"요구사항\"에 사용자가 보는 동작을, \"수용 기준\" 표에 기준마다 확인 방법(검사 명령, 화면 확인, 기기 확인)을, \"범위 밖\"에 하지 않을 것을 쓴다. 버그면 요구사항에 증상과 재현 방법을 쓴다.",
  "\"변경 파일\" 표에 고칠 코드와 고칠 문서를 모두 쓴다.",
  "\"위험\"에 깨질 수 있는 곳을 쓴다.",
]
checks = [
  {check = "filled", section = "요구사항", part = "solo"},
  {check = "table", section = "수용 기준", part = "solo"},
  {check = "filled", section = "범위 밖", part = "solo"},
  {check = "files_listed", part = "solo"},
  {check = "table", section = "변경 파일", part = "solo"},
]
roles = ["plan"]
