name = "feature"
description = "기능 경로(feature, refactor). 명세, 계획, 구현, 테스트, 기록으로 간다"
version = 1
origin = "library"
applies_when = {answer = {work = "service"}, not = {answer = {solo = "yes"}}}

[project]
plans_dir = "plans"
plan_prefix = "P"
code = ["src/*", "app/*", "lib/*", "server/*", "client/*", "packages/*", "tests/*", "test/*"]
tracked = [
  "src",
  "app",
  "lib",
  "server",
  "client",
  "packages",
  "tests",
  "test",
  "plans",
  "docs",
  ".gate",
  ".githooks",
]
files_section = "변경 파일"
unreviewed = ["테스트 결과", "테스트 수정", "기록"]
stop_states = ["RECORD"]
max_visits = 3
test = ""
affected = ""
tests = [
  "tests/*",
  "test/*",
  "*/tests/*",
  "*/test/*",
  "*/__tests__/*",
  "*/test_*",
  "test_*",
  "*_test.*",
  "*.test.*",
  "*.spec.*",
]

[review]
tools = "Read,Grep,Glob"
effort = "high"

[records]
index = "plans/INDEX.md"
index_items = ["기록: 바뀐 동작"]

[kinds.feature]
states = ["SPEC", "PLAN", "IMPLEMENT", "TEST", "RECORD"]
back = {TEST = ["IMPLEMENT", "PLAN", "SPEC"]}

[kinds.refactor]
states = ["PLAN", "IMPLEMENT", "TEST", "RECORD"]
back = {TEST = ["IMPLEMENT", "PLAN"]}

[sections."요구사항"]

[sections."수용 기준"]
body = """
| 기준 | 확인 방법 |
|---|---|
"""

[sections."범위 밖"]

[sections."가정"]

[sections."변경 파일"]
body = """
| 파일 | 바꿀 내용 |
|---|---|
"""

[sections."테스트 계획"]
body = """
- 새 테스트 명령:
- 테스트 명령:
- 확인할 동작:
"""

[sections."위험"]

[sections."테스트 결과"]
body = """
| 기준이나 동작 | 결과 |
|---|---|
"""

[sections."테스트 수정"]
body = """
| 파일 | 고친 이유 |
|---|---|
"""

[sections."기록"]
body = """
- 바뀐 동작:
- 문서 영향:
- 남은 일:
"""

[states.SPEC]
sections = ["요구사항", "수용 기준", "범위 밖", "가정"]
todo = [
  "절을 채우기 전에 사용자가 정해야 하는데 비어 있는 것(목적, 범위, 완료 기준)을 한 번에 하나씩 추천 답과 함께 묻는다. 코드와 docs로 알 수 있는 것은 직접 찾는다.",
  "\"요구사항\" 절에 사용자가 보는 동작을 쓴다.",
  "\"수용 기준\" 표에 기준마다 확인 방법(테스트, 화면 확인, 명령)을 쓴다.",
  "\"범위 밖\" 절에 이번에 하지 않을 것을 쓴다.",
  "\"가정\" 절에 사용자에게 묻지 않고 기본값으로 정한 것을 쓴다.",
  "next P### --review로 검토자를 부른다.",
]
checks = [
  {check = "filled", section = "요구사항"},
  {check = "table", section = "수용 기준"},
  {check = "filled", section = "범위 밖"},
]
review = "{plan}의 '요구사항', '수용 기준', '범위 밖' 절을 검토한다. 저장소의 관련 코드와 docs/를 읽는다. 다음을 찾는다. (1) 확인 방법이 없거나 주관적인 수용 기준 (2) 요구사항에 있는데 수용 기준이 없는 동작 (3) 기존 코드의 동작과 어긋나는 요구사항 (4) '가정' 절에서 사용자가 정해야 하는데 근거 없이 정한 것과 요구사항이 전제하는데 '가정'에 없는 것."
review_model = "sonnet"

[states.PLAN]
roles = ["plan"]
sections = ["변경 파일", "테스트 계획", "위험"]
todo = [
  "\"변경 파일\" 표에 고칠 파일과 바꿀 내용을 쓴다. 테스트 파일도 쓴다.",
  "\"테스트 계획\"에 새로 쓸 테스트만 돌리는 명령(새 테스트 명령), 전체 테스트 명령, 확인할 동작(수용 기준이나 refactor가 보존할 동작)을 쓴다.",
  "\"위험\" 절에 깨질 수 있는 곳을 쓴다.",
  "next P### --review로 검토자를 부른다.",
]
checks = [
  {check = "files_listed"},
  {check = "table", section = "변경 파일"},
  {check = "filled", section = "테스트 계획", items = ["확인할 동작"]},
  {check = "filled", section = "테스트 계획", items = ["새 테스트 명령"], only = ["feature"]},
]
review = "{plan}의 계획을 검토한다. 계획 파일이 가리키는 코드와 테스트를 읽는다. 다음을 찾는다. (1) 요구사항이나 목표 중 '변경 파일' 표가 다루지 않는 것 (2) 수용 기준이나 보존할 동작 중 '테스트 계획'이 확인하지 않는 것 (3) 기존 구조와 어긋나는 설계 (4) '위험'에 빠진 영향 범위."
review_model = "sonnet"

[states.IMPLEMENT]
roles = ["implement"]
code = true
sections = ["변경 파일"]
todo = [
  "\"변경 파일\" 표대로 코드를 쓴다. 표에 없는 파일이 필요하면 표에 더한다(pre-commit이 표에 없는 코드 파일을 막는다).",
  "코드 작성은 Agent 도구에 model \"sonnet\"과 effort \"high\"를 주고 계획 파일 경로와 통과시킬 테스트 명령을 넘겨 서브에이전트에 맡긴다. 몇 줄만 고치면 직접 쓴다. 돌아온 변경을 확인한다.",
  "먼저 쓴 테스트나 refactor 전의 테스트를 고치거나 지우면 \"테스트 수정\" 표에 파일과 이유를 쓴다. 기대값을 구현에 맞춰 바꾸지 않는다.",
  "코드를 커밋한다. chore는 [project] affected(비었으면 test) 명령이 통과해야 넘어간다.",
]
checks = [
  {check = "files_listed"},
  {check = "clean"},
  {check = "files_changed", any = true},
  {check = "command", use = "affected", optional = true, only = ["chore"]},
]

[states.TEST]
roles = ["verify"]
sections = ["테스트 결과", "테스트 수정"]
todo = [
  "새 테스트 명령과 전체 테스트 명령([project] test, 비었으면 \"테스트 계획\"의 테스트 명령)을 돌린다.",
  "\"테스트 결과\" 표에 기준이나 동작마다 결과를 쓴다. feature는 \"수용 기준\" 표의 기준을 첫 칸에 그대로 옮긴다.",
]
checks = [
  {check = "clean"},
  {check = "test_edits", section = "테스트 수정", only = ["refactor"]},
  {check = "unchanged", state = "SPEC", only = ["feature"]},
  {check = "command", section = "테스트 계획", item = "새 테스트 명령", only = ["feature"]},
  {check = "command", use = "test", section = "테스트 계획", item = "테스트 명령"},
  {check = "table", section = "테스트 결과"},
  {check = "covers", section = "테스트 결과", from = "수용 기준", only = ["feature"]},
]

[states.RECORD]
roles = ["record"]
sections = ["기록"]
todo = ["\"기록\" 절에 바뀐 동작, 문서 영향, 남은 일을 쓴다.", "README, docs, CHANGELOG에 영향이 있으면 고쳐 커밋한다."]
checks = [
  {check = "filled", section = "기록", items = ["바뀐 동작", "문서 영향", "남은 일"]},
]
