# service preset: 웹 서비스와 앱 개발
# 하네스 구조의 원본이다. 종류(kinds)는 상태 순서와 조건부 경로(when)를, 상태(states)는 할 일, 검사, 쓰는 절을,
# 절(sections)은 계획 틀에 들어갈 내용을 정한다. 이 파일은 제안서와 gate adopt로만 바꾼다(.gate/GATE.md).
version = 1

[project]
plans_dir = "plans"
plan_prefix = "P"
# 고칠 때 코드 상태(code = true)인 계획이 있어야 하는 파일. *는 /도 넘는다
code = ["src/*", "app/*", "lib/*", "server/*", "client/*", "packages/*", "tests/*", "test/*"]
# stop hook이 이 세션이 고친 파일의 미커밋 변경을 보는 폴더
tracked = ["src", "app", "lib", "server", "client", "packages", "tests", "test", "plans", "docs", ".gate", ".githooks"]
files_section = "변경 파일"
unreviewed = ["테스트 결과", "원인", "검증", "기록"]
# 이번 턴에 다룬 계획이 이 상태에 있으면 멈추지 못한다
stop_states = ["RECORD"]
max_visits = 3
# 프로젝트 전체 테스트 명령. TEST와 VERIFY가 쓴다. 비우면 계획 파일의 테스트 명령을 쓴다
test = ""

[review]
tools = "Read,Grep,Glob"

[kinds.feature]
states = ["SPEC", "PLAN", "TESTFIRST", "IMPLEMENT", "TEST", "RECORD"]

[kinds.bugfix]
states = ["REPRO", "FIX", "VERIFY", "RECORD"]

[kinds.refactor]
states = ["PLAN", "IMPLEMENT", "TEST", "RECORD"]

[kinds.chore]
states = ["IMPLEMENT", "RECORD"]

[sections."요구사항"]

[sections."수용 기준"]
body = """
| 기준 | 확인 방법 |
|---|---|
"""

[sections."범위 밖"]

[sections."변경 파일"]
body = """
| 파일 | 바꿀 내용 |
|---|---|
"""

[sections."테스트 계획"]
body = """
- 새 테스트 명령:
- 테스트 명령:
- 확인할 동작:
"""

[sections."위험"]

[sections."테스트 결과"]
body = """
| 기준이나 동작 | 결과 |
|---|---|
"""

[sections."재현"]
body = """
- 증상:
- 재현 명령:
"""

[sections."원인"]

[sections."검증"]
body = """
- 테스트 명령:
- 결과:
"""

[sections."기록"]
body = """
- 바뀐 동작:
- 문서 영향:
- 남은 일:
"""

[states.SPEC]
sections = ["요구사항", "수용 기준", "범위 밖"]
todo = [
  "\"요구사항\" 절에 사용자가 보는 동작을 쓴다.",
  "\"수용 기준\" 표에 기준마다 확인 방법(테스트, 화면 확인, 명령)을 쓴다.",
  "\"범위 밖\" 절에 이번에 하지 않을 것을 쓴다.",
  "next P### --review로 검토자를 부른다.",
]
checks = [
  {check = "filled", section = "요구사항"},
  {check = "table", section = "수용 기준"},
  {check = "filled", section = "범위 밖"},
]
review = "{plan}의 '요구사항', '수용 기준', '범위 밖' 절을 검토한다. 저장소의 관련 코드와 docs/를 읽는다. 다음을 찾는다. (1) 확인 방법이 없거나 주관적인 수용 기준 (2) 요구사항에 있는데 수용 기준이 없는 동작 (3) 기존 코드의 동작과 어긋나는 요구사항."

[states.PLAN]
sections = ["변경 파일", "테스트 계획", "위험"]
todo = [
  "\"변경 파일\" 표에 고칠 파일과 바꿀 내용을 쓴다. 테스트 파일도 쓴다.",
  "\"테스트 계획\"에 새로 쓸 테스트만 돌리는 명령(새 테스트 명령), 전체 테스트 명령, 확인할 동작(수용 기준이나 refactor가 보존할 동작)을 쓴다.",
  "\"위험\" 절에 깨질 수 있는 곳을 쓴다.",
  "next P### --review로 검토자를 부른다.",
]
checks = [
  {check = "files_listed"},
  {check = "table", section = "변경 파일"},
  {check = "filled", section = "테스트 계획", items = ["확인할 동작"]},
  {check = "filled", section = "테스트 계획", items = ["새 테스트 명령"], only = ["feature"]},
]
review = "{plan}의 계획을 검토한다. 계획 파일이 가리키는 코드와 테스트를 읽는다. 다음을 찾는다. (1) 요구사항이나 목표 중 '변경 파일' 표가 다루지 않는 것 (2) 수용 기준이나 보존할 동작 중 '테스트 계획'이 확인하지 않는 것 (3) 기존 구조와 어긋나는 설계 (4) '위험'에 빠진 영향 범위."

[states.TESTFIRST]
code = true
sections = ["테스트 계획"]
todo = [
  "수용 기준마다 테스트를 먼저 쓰고 \"변경 파일\" 표에 넣는다. 구현 코드는 아직 쓰지 않는다.",
  "테스트를 커밋한다. \"새 테스트 명령\"이 지금 실패해야 넘어간다(구현 전이라 실패하는 게 맞다).",
]
checks = [
  {check = "files_listed"},
  {check = "clean"},
  {check = "files_changed", any = true},
  {check = "command", section = "테스트 계획", item = "새 테스트 명령", expect = "fail"},
]

[states.IMPLEMENT]
code = true
sections = ["변경 파일"]
todo = [
  "\"변경 파일\" 표대로 코드를 쓴다. 표에 없는 파일이 필요하면 표에 더한다(pre-commit이 표에 없는 코드 파일을 막는다).",
  "코드를 커밋한다.",
]
checks = [
  {check = "files_listed"},
  {check = "clean"},
  {check = "files_changed", any = true},
]

[states.TEST]
sections = ["테스트 결과"]
todo = [
  "새 테스트 명령과 전체 테스트 명령([project] test, 비었으면 \"테스트 계획\"의 테스트 명령)을 돌린다.",
  "\"테스트 결과\" 표에 기준이나 동작마다 결과를 쓴다.",
]
checks = [
  {check = "clean"},
  {check = "command", section = "테스트 계획", item = "새 테스트 명령", only = ["feature"]},
  {check = "command", use = "test", section = "테스트 계획", item = "테스트 명령"},
  {check = "table", section = "테스트 결과"},
]

[states.REPRO]
code = true
sections = ["재현", "변경 파일"]
todo = [
  "\"재현\" 절에 증상과 재현 명령을 쓴다. 재현 명령은 지금 실패해야 한다.",
  "재현 테스트를 쓰고 \"변경 파일\" 표에 넣은 뒤 커밋한다.",
]
checks = [
  {check = "filled", section = "재현", items = ["증상", "재현 명령"]},
  {check = "clean"},
  {check = "command", section = "재현", item = "재현 명령", expect = "fail"},
]

[states.FIX]
code = true
sections = ["원인"]
todo = [
  "\"원인\" 절에 원인과 고친 위치를 쓴다.",
  "고치고 커밋한다. 재현 명령이 통과해야 넘어간다.",
]
checks = [
  {check = "filled", section = "원인"},
  {check = "clean"},
  {check = "files_changed", any = true},
  {check = "command", section = "재현", item = "재현 명령"},
]

[states.VERIFY]
sections = ["검증"]
todo = [
  "전체 테스트 명령([project] test, 비었으면 \"검증\" 절의 테스트 명령)을 돌리고 결과를 쓴다.",
]
checks = [
  {check = "filled", section = "검증", items = ["결과"]},
  {check = "command", use = "test", section = "검증", item = "테스트 명령"},
]

[states.RECORD]
sections = ["기록"]
todo = [
  "\"기록\" 절에 바뀐 동작, 문서 영향, 남은 일을 쓴다.",
  "README, docs, CHANGELOG에 영향이 있으면 고쳐 커밋한다.",
]
checks = [
  {check = "filled", section = "기록", items = ["바뀐 동작", "문서 영향", "남은 일"]},
]
