name = "experiment"
description = "실험 경로(new, model, tune, freeze, repro). 조사와 후보에서 출발해 계획, 구현, 실행, 기록, 재계획으로 간다"
version = 1
origin = "library"
applies_when = {answer = {work = "experiment"}}

[project]
plans_dir = "experiments/plans"
plan_prefix = "P"
code = ["experiments/*.py", "src/*.py", "submissions/*.py"]
tracked = ["progress", "experiments", "src", "submissions", "docs", ".gate", ".githooks"]
files_section = "행 조건 대조표"
unreviewed = ["기록", "결정", "실행 계획: 예상 소요 시간과 근거", "행 조건 대조표[3]"]
stop_states = ["RECORD", "REPLAN"]
max_visits = 3
decisions_file = "progress/decisions.md"
status_file = "progress/status.md"
status_sections = ["단계", "열린 질문", "다음에 볼 것"]

[remote]
exec_states = ["RECORD"]
# IMPLEMENT의 표본 실행은 results/P###_sample에 쓰는 ssh 명령만 연다
sample_states = ["IMPLEMENT"]
sample_pattern = "(?i)\\bresults/p\\d+_sample\\b"

[review]
tools = "Read,Grep,Glob"
effort = "high"
cite = ["E\\d{3}"]

[records]
archive_file = "progress/history.md"
index = "experiments/plans/INDEX.md"
index_items = ["기록: log.csv 행", "결정: 고른 갈래"]
ledgers = ["experiments/log.csv", "progress/decisions.md"]
supersedes = "^- 대체하는 결정:"
superseded = "^- 대체됨:"

[kinds.new]
states = ["RESEARCH", "IDEATE", "SELECT", "PLAN", "IMPLEMENT", "RUN", "RECORD", "REPLAN"]
back = {RUN = ["IMPLEMENT", "PLAN"]}

[kinds.model]
states = ["RESEARCH", "IDEATE", "SELECT", "PLAN", "IMPLEMENT", "RUN", "RECORD", "REPLAN"]
back = {RUN = ["IMPLEMENT", "PLAN"]}

[kinds.tune]
states = ["PLAN", "IMPLEMENT", "RUN", "RECORD", "REPLAN"]
back = {RUN = ["IMPLEMENT", "PLAN"]}

[kinds.freeze]
states = ["PLAN", "IMPLEMENT", "RUN", "RECORD", "REPLAN"]
back = {RUN = ["IMPLEMENT", "PLAN"]}

[kinds.repro]
states = ["PLAN", "RUN", "RECORD"]
back = {RUN = ["PLAN"]}

[sections."조사"]
body = """
| 읽은 문서(경로나 URL) | 읽고 얻은 것 |
|---|---|

| 지난 실험 번호 | 이번 계획과의 관계 |
|---|---|
"""

[sections."후보"]
body = """
| 후보 ID | 축 | 후보 | 기대 이득 | 비용 | 겹치는 지난 실험 | 선택 | 이유(한두 문장과 실험 번호) |
|---|---|---|---|---|---|---|---|

- 고른 묶음:
"""

[sections."행 조건 대조표"]
body = """
| 아이디어 행의 조건 | 구현 파일 | 함수나 위치 |
|---|---|---|
"""

[sections."비교 기준"]
body = """
- 기준 실험:
- 판정 규칙:
"""

[sections."결과별 다음 행동"]
body = """
| 결과 경계 | 다음 행동 | 가리키는 항목 |
|---|---|---|
"""

[sections."실행 계획"]
body = """
- 실행 위치:
- 결과 파일:
- 조기 종료 결과 파일:
- 예상 소요 시간과 근거:
- 가벼운 실행:
"""

[sections."기록"]
body = """
- log.csv 행:
- ideas.md 상태:
- 일반 원칙과의 관계:
"""

[sections."결정"]
body = """
- 고른 갈래:
- status.md 영향:
"""

[states.RESEARCH]
sections = ["조사"]
todo = ["관련 문서(논문, 위키, 지난 대회 솔루션)를 읽고 \"조사\" 절 첫 표에 경로나 URL과 얻은 것을 쓴다.", "같은 정보원을 다룬 지난 실험 번호를 둘째 표에 쓴다."]
checks = [
  {check = "table", section = "조사", index = 0},
  {check = "paths_exist", section = "조사"},
  {check = "refs", section = "조사", pattern = "E\\d{3}", file = "experiments/log.csv"},
]

[states.IDEATE]
sections = ["후보"]
todo = [
  "정보원 하나를 여러 축(정보 표현, 넣는 자리, 범위, 조건부 적용, 기존 신호와 조합, 다른 정보원, 조사한 기법)으로 펼쳐 \"후보\" 표에 쓴다. 일부러 엉뚱한 후보도 넣는다.",
  "새 후보는 progress/ideas.md에 행을 더한다.",
  "뺄 후보는 선택 칸에 \"제외\"와 이유를 쓴다. 이유는 한두 문장과 실험 번호로 250자 안에 쓴다.",
  "next P### --review로 검토자를 부른다.",
]
checks = [
  {check = "table", section = "후보", min_rows = 3},
  {check = "cell_max", section = "후보", column = 7, max = 250},
]
context = ["progress/ideas.md", "experiments/log.csv"]
review = "{plan}의 '조사'와 '후보' 절을 검토한다. 먼저 발췌 {context}를 읽고, 더 필요한 내용은 원본을 Grep으로 찾아 필요한 줄만 읽는다(progress/ideas.md, experiments/log.csv를 Read로 통째로 열지 않는다). '조사' 절에 적힌 문서를 읽는다. 다음을 찾는다. (1) 후보가 없거나 형식만 채운 축 (2) 조사한 문서와 ideas.md에 있는데 후보에 없는 기법 (3) 지난 실험에서 기여가 없던 방식과 같은데 이유 없이 넣은 후보."
review_model = "sonnet"

[states.SELECT]
sections = ["후보"]
todo = [
  "후보마다 기대 이득, 비용, 겹치는 지난 실험 번호를 채운다.",
  "이번에 잴 후보는 선택 칸에 \"선택\", 미룰 후보는 \"보류\"를 쓰고 이유를 한두 문장과 실험 번호로 250자 안에 쓴다. 싼 변형은 한 실험으로 묶는다.",
  "\"고른 묶음\"에 함께 잴 후보와 묶은 이유를 쓴다.",
]
checks = [
  {check = "filled", section = "후보", items = ["고른 묶음"]},
  {check = "cell_max", section = "후보", column = 7, max = 250},
  {check = "refs", section = "후보", pattern = "E\\d{3}", file = "experiments/log.csv"},
]

[states.PLAN]
roles = ["plan"]
sections = ["행 조건 대조표", "비교 기준", "결과별 다음 행동", "실행 계획"]
todo = [
  "\"행 조건 대조표\"에 아이디어 행의 조건 하나마다 구현할 파일과 함수를 쓴다.",
  "\"비교 기준\"에 기준 실험 번호와 판정 규칙(seed 수, 작은 차이의 처리)을 쓴다.",
  "\"결과별 다음 행동\"에 수치 경계를 붙인 갈래를 두 개 이상 쓴다. 어느 갈래에도 맞지 않으면 \"예상 밖이면 RESEARCH부터\"로 둔다.",
  "\"실행 계획\"에 실행 위치, 결과 파일 경로, 예상 소요 시간과 근거를 쓴다. 일찍 끝나는 갈래가 있으면 그 갈래에서도 생기는 파일을 \"조기 종료 결과 파일\"에 쓴다. 실행 비용이 작아 IMPLEMENT 코드 diff 검토를 건너뛸 실행이면 \"가벼운 실행\"에 \"예(이유)\"를 쓴다.",
  "next P### --review로 검토자를 부른다.",
]
checks = [
  {check = "table", section = "행 조건 대조표"},
  {check = "files_listed", skip = ["repro"]},
  {check = "filled", section = "비교 기준", items = ["기준 실험", "판정 규칙"]},
  {check = "table", section = "결과별 다음 행동", min_rows = 2},
  {check = "filled", section = "실행 계획", items = ["실행 위치", "결과 파일", "예상 소요 시간과 근거"]},
  {check = "refs", section = "비교 기준", pattern = "E\\d{3}", file = "experiments/log.csv"},
]
context = ["progress/ideas.md", "progress/decisions.md", "progress/status.md", "experiments/log.csv"]
review = "{plan}의 계획을 검토한다. 먼저 발췌 {context}를 읽고, 더 필요한 내용은 원본을 Grep으로 찾아 필요한 줄만 읽는다(발췌의 네 파일을 Read로 통째로 열지 않는다). 다음을 찾는다. (1) 아이디어 행 문장의 조건 중 '행 조건 대조표'에 없는 것 (2) decisions.md의 결정과 어긋나는 설정 (3) status.md 계획과 맞지 않는 '결과별 다음 행동' (4) 근거가 없는데 근거 있는 것처럼 적은 값 (5) '실행 계획'의 '가벼운 실행'이 '예'인데 예상 소요 시간과 근거로 보아 실행 비용이 작지 않거나 결과가 채택 후보로 이어져 IMPLEMENT 코드 diff 검토를 건너뛰면 안 되는 실행."
review_model = "sonnet"

[states.IMPLEMENT]
roles = ["implement"]
sections = ["행 조건 대조표"]
code = true
todo = ["행 조건 대조표대로 코드를 쓴다.",
        "서버 표본은 출력을 results/P###_sample에 쓰는 명령으로 돌린다([remote] sample_pattern). 그 밖의 서버 실행은 실행 상태에서 한다."]
checks = [
  {check = "files_listed"},
  {check = "clean"},
  {check = "files_changed"},
]

[states.RUN]
roles = ["execute"]
sections = ["실행 계획"]
todo = ["결과가 나오면 next로 RECORD에 들어간다."]
checks = [
  {check = "results", section = "실행 계획", item = "결과 파일"},
]

[states.RECORD]
roles = ["record"]
sections = ["기록"]
todo = [
  "experiments/log.csv에 실험 행을 쓰고 \"기록\" 절의 log.csv 행에 그 실험 번호를 쓴다.",
  "progress/ideas.md 행의 상태를 결과에 맞게 고치고 실험 번호를 쓴다.",
  "결과가 일반 원칙과 어긋나는지 \"기록\" 절에 쓴다.",
  "답에 \"기록\" 절 내용을 옮겨 쓴다.",
]
checks = [
  {check = "refs", section = "기록", pattern = "E\\d{3}", file = "experiments/log.csv", required = true, skip = ["eda", "infra"]},
  {check = "refs", section = "기록", pattern = "E\\d{3}", file = "progress/ideas.md", skip = ["eda", "infra"]},
  {check = "filled", section = "기록", items = ["일반 원칙과의 관계"], skip = ["infra"]},
]

[states.REPLAN]
roles = ["decide"]
sections = ["결정"]
todo = [
  "\"결과별 다음 행동\"에서 결과에 맞는 갈래를 골라 \"결정\" 절에 쓴다.",
  "어느 갈래에도 맞지 않으면 \"고른 갈래\"에 \"예상 밖\"을 쓰고 start --from P###로 새 계획을 RESEARCH에서 시작한다.",
  "progress/status.md \"다음에 볼 것\"에 주는 영향을 쓰고 이 계획 번호를 적어 커밋한다.",
  "답에 \"결정\" 절 내용을 옮겨 쓴다.",
]
checks = [
  {check = "filled", section = "결정", items = ["고른 갈래", "status.md 영향"]},
  {check = "unchanged", state = "PLAN", sections = ["비교 기준", "결과별 다음 행동"], skip = ["eda"]},
  {check = "choice", section = "결정", item = "고른 갈래", options = "결과별 다음 행동", escape = "예상 밖"},
  {check = "commit_since", path = "progress/status.md", mention = true},
  {check = "doc_size"},
]

[[attach]]
states = ["IMPLEMENT"]
at = 80
todo = ["코드와 계획 파일을 커밋한다."]
checks = [
  {check = "reviewed", state = "PLAN", skip = ["infra"]},
]
